[package]
name = "only-gate"
version = "0.2.0"
edition = "2024"
description = "Real gate verification engine for DGV compliance testing — v0.6.0"

[dependencies]
# Core utilities (existing)
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
serde_json = "1.0"
regex = "1.10"
only-core = { path = "../only-core" }
only-memory = { path = "../only-memory" }

# v0.6.0 — Post-quantum cryptography (NIST FIPS 203 + FIPS 204)
ml-dsa = { version = "0.1", features = ["getrandom"] }
ml-kem = { version = "0.3", features = ["getrandom"] }
kem = "0.3"

# v0.6.0 — Real Groth16 zkSNARK on BN254 curve
ark-groth16 = { version = "0.6", features = ["r1cs"] }
ark-bn254 = "0.6"
ark-ff = "0.6"
ark-r1cs-std = "0.6"
ark-relations = "0.6"
ark-snark = "0.6"
ark-std = "0.6"

# Ed25519 real signing (RFC 8032)
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = { version = "0.8", features = ["getrandom"] }
