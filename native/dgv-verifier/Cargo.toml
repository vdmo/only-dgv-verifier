[package]
name = "dgv-verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
only-core = { path = "../only-core" }
only-evolution = { path = "../only-evolution" }
only-memory = { path = "../only-memory" }
only-lang = { path = "../only-lang" }
only-gate = { path = "../only-gate" }
nom = "7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = { version = "0.8", features = ["getrandom"] }
