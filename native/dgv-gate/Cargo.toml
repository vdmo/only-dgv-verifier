[package]
name = "dgv-gate"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
only-core = { path = "../only-core" }
only-lang = { path = "../only-lang" }
only-memory = { path = "../only-memory" }
only-gate = { path = "../only-gate" }
dgv-storage = { path = "../dgv-storage" }
tower-http = { version = "0.5.2", features = ["cors"] }
chrono = "0.4"
serde_yaml = "0.9"
