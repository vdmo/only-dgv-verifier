[package]
name = "dgv-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "dgv_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
dgv-storage = { path = "../dgv-storage" }
only-core = { path = "../only-core" }
only-lang = { path = "../only-lang" }
only-gate = { path = "../only-gate" }
only-memory = { path = "../only-memory" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
