[package]
name = "only-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
only-core = { path = "../only-core" }
reqwest = { version = "0.12", features = ["json"] }
only-lang = { path = "../only-lang" }
only-memory = { path = "../only-memory" }
sha2 = "0.10"
lazy_static = "1.4"
hex = "0.4"
tower-http = { version = "0.5.2", features = ["fs", "cors"] }
urlencoding = "2.1.3"
