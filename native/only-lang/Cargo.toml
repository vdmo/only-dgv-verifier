[package]
name = "only-lang"
version = "0.1.0"
edition = "2021"

[dependencies]
only-core = { path = "../only-core" }
only-evolution = { path = "../only-evolution" }
only-memory = { path = "../only-memory" }
nom = "7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
hmac = "0.12"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
regex = "1"
rand = "0.10.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = []
helix = []
zk = ["ark-ff", "ark-ec", "ark-groth16", "ark-relations", "ark-serialize", "ark-snark", "ark-bn254", "ark-std", "ark-crypto-primitives"]

[dependencies.ark-ff]
version = "0.5"
optional = true
default-features = false
features = ["std"]

[dependencies.ark-ec]
version = "0.5"
optional = true
default-features = false
features = ["std"]

[dependencies.ark-groth16]
version = "0.5"
optional = true
default-features = false
features = ["std"]

[dependencies.ark-relations]
version = "0.5"
optional = true
default-features = false
features = ["std"]

[dependencies.ark-serialize]
version = "0.5"
optional = true
default-features = false
features = ["std"]

[dependencies.ark-snark]
version = "0.5"
optional = true
default-features = false

[dependencies.ark-bn254]
version = "0.5"
optional = true
default-features = false
features = ["curve"]

[dependencies.ark-std]
version = "0.5"
optional = true
default-features = false
features = ["std", "getrandom"]

[dependencies.ark-crypto-primitives]
version = "0.5"
optional = true
default-features = false
features = ["snark"]


