version: "3.8"

# DGV Gate — docker-compose for production deployment
# Includes gate + Postgres + optional reverse proxy (nginx for TLS termination)

services:
  postgres:
    image: postgres:16-alpine
    container_name: dgv-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: dgv_gate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dgv-network

  gate:
    build:
      context: .
      dockerfile: Dockerfile.gate
    container_name: dgv-gate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DGV_STORAGE: postgres
      DGV_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/dgv_gate
      DGV_SIGNING_KEY: /data/dgv_signing_key.hex
      DGV_ADMIN_KEY: ${DGV_ADMIN_KEY:-}
      DGV_LISTEN_ADDR: 0.0.0.0:7878
      DGV_CORS_ORIGINS: ${DGV_CORS_ORIGINS:-*}
      DGV_RATE_LIMIT_MAX: ${DGV_RATE_LIMIT_MAX:-100}
      DGV_RATE_LIMIT_WINDOW_MS: ${DGV_RATE_LIMIT_WINDOW_MS:-60000}
    volumes:
      - gate_data:/data
    ports:
      - "7878:7878"
    networks:
      - dgv-network
    restart: unless-stopped

  # Optional: second gate instance for multi-node testing
  gate-replica:
    build:
      context: .
      dockerfile: Dockerfile.gate
    container_name: dgv-gate-replica
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DGV_STORAGE: postgres
      DGV_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/dgv_gate
      DGV_SIGNING_KEY: /data/dgv_signing_key.hex
      DGV_ADMIN_KEY: ${DGV_ADMIN_KEY:-}
      DGV_LISTEN_ADDR: 0.0.0.0:7879
      DGV_CORS_ORIGINS: ${DGV_CORS_ORIGINS:-*}
      DGV_RATE_LIMIT_MAX: ${DGV_RATE_LIMIT_MAX:-100}
      DGV_RATE_LIMIT_WINDOW_MS: ${DGV_RATE_LIMIT_WINDOW_MS:-60000}
    volumes:
      - gate_data_replica:/data
    ports:
      - "7879:7879"
    networks:
      - dgv-network
    restart: unless-stopped
    profiles:
      - replica  # Only start with: docker-compose --profile replica up

  # Optional: nginx reverse proxy for TLS termination
  nginx:
    image: nginx:alpine
    container_name: dgv-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - gate
    networks:
      - dgv-network
    restart: unless-stopped
    profiles:
      - tls  # Only start with: docker-compose --profile tls up

volumes:
  postgres_data:
  gate_data:
  gate_data_replica:

networks:
  dgv-network:
    driver: bridge
