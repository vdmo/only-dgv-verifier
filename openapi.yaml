openapi: 3.0.3
info:
  title: DGV Enforcement Gate API
  description: |
    HTTP enforcement gate for autonomous agents. Intercepts tool calls and returns
    computed decisions with signed receipts. Supports persistent storage (SQLite/Postgres),
    multi-tenant policies, distributed revocation, and rate limiting.

    **Authentication**: Admin endpoints require `X-Admin-Key` header when `DGV_ADMIN_KEY`
    is set. When `DGV_JWT_SECRET`, `DGV_JWT_PUBLIC_KEY`, or `DGV_JWT_JWKS_URL` is set,
    `/govern`, `/execute`, `/approve`, and A2A inbox/ack require a valid
    `Authorization: Bearer` JWT — HS256, RS256 (static PEM), or RS256 via JWKS with
    `kid`-based key rotation. The `sub` claim becomes the verified agent identity.

    **A2A**: agents exchange signed Ed25519 envelopes via `/a2a/*`. Keys are
    admin-provisioned; payloads never transit the gate (hash-only).

    **Circuit breakers**: `/tool-health/*` endpoints track per-tool failure
    cascades and auto-deny new proposals while a circuit is open.
  version: "0.4.0"
  contact:
    name: DGV Verifier
    url: https://github.com/vdmo/only-dgv-verifier

servers:
  - url: http://localhost:7878
    description: Local development
  - url: https://gate.example.com
    description: Production (TLS terminated by reverse proxy)

tags:
  - name: Core
    description: Core governance and execution endpoints
  - name: Policies
    description: Policy management (admin)
  - name: Revocations
    description: Revocation management (admin)
  - name: Tenants
    description: Multi-tenant isolation (admin)
  - name: Config
    description: Runtime configuration (admin)
  - name: CircuitBreaker
    description: Per-tool circuit breakers — cascading-failure protection
  - name: A2A
    description: Agent-to-agent signed envelopes — authenticated, replay-protected messaging

paths:
  /govern:
    post:
      tags: [Core]
      summary: Evaluate a proposal
      description: |
        Evaluates a tool call proposal against the active governance policy.
        Returns a signed decision. If ALLOW, includes an auth token for execution.
      operationId: govern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Proposal'
      responses:
        '200':
          description: Decision returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernResponse'

  /execute:
    post:
      tags: [Core]
      summary: Execute with a token
      description: |
        Verifies an auth token and marks it consumed. The token must match the
        tool, action, and params hash. One-use only — replay is blocked.
      operationId: execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
      responses:
        '200':
          description: Execution receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteResponse'
        '403':
          description: Token invalid, expired, consumed, or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteResponse'

  /verify/{run_id}:
    get:
      tags: [Core]
      summary: Verify a decision
      description: |
        Re-derives the decision hash from stored replay inputs and compares to
        the stored hash. Detects tampering.
      operationId: verify
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '404':
          description: Run ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'

  /health:
    get:
      tags: [Core]
      summary: Health check
      operationId: health
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /stats:
    get:
      tags: [Core]
      summary: Get statistics
      operationId: stats
      responses:
        '200':
          description: Decision and token counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'

  /policies:
    post:
      tags: [Policies]
      summary: Store a policy
      description: Store a governance policy for a tool+action pair. Requires admin key.
      operationId: storePolicy
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePolicyRequest'
      responses:
        '200':
          description: Policy stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePolicyResponse'
        '401':
          description: Admin auth required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /policies/load-file:
    post:
      tags: [Policies]
      summary: Load policies from a file
      description: Bulk-load policies from a YAML or JSON file. Requires admin key.
      operationId: loadPolicyFile
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadPolicyFileRequest'
      responses:
        '200':
          description: Policies loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadPolicyFileResponse'
        '400':
          description: File not found or parse error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Admin auth required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /policies/{tool}/{action}:
    get:
      tags: [Policies]
      summary: Get active policy
      description: Get the active governance policy for a tool+action pair.
      operationId: getPolicy
      parameters:
        - name: tool
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRecord'
        '404':
          description: No active policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /revocations:
    post:
      tags: [Revocations]
      summary: Revoke an actor
      description: Revoke an agent's authority. Takes effect immediately. Requires admin key.
      operationId: revoke
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '200':
          description: Actor revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
        '401':
          description: Admin auth required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Revocations]
      summary: List revocations
      description: List all revoked actors. Public endpoint.
      operationId: listRevocations
      responses:
        '200':
          description: List of revocations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevocationRecord'

  /tenant/{tenant_id}/policies:
    post:
      tags: [Tenants]
      summary: Store tenant-specific policy
      description: Store a governance policy scoped to a specific tenant. Requires admin key.
      operationId: storeTenantPolicy
      security:
        - adminKey: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePolicyRequest'
      responses:
        '200':
          description: Tenant policy stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePolicyResponse'
        '401':
          description: Admin auth required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /approve/{token_id}:
    post:
      tags: [Governance]
      summary: Approve a token
      description: Approve a token for multi-approval policies. Requires admin key.
      operationId: approveToken
      security:
        - adminKey: []
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approver_id]
              properties:
                approver_id:
                  type: string
                  description: ID of the approving entity
      responses:
        '200':
          description: Token approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  approved:
                    type: boolean
                  token_id:
                    type: string
                  approval_count:
                    type: integer
                  min_approvals:
                    type: integer
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Token already consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Admin auth required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tool-health/report:
    post:
      tags: [CircuitBreaker]
      summary: Report a tool execution outcome
      description: |
        Callers report downstream tool outcomes. Consecutive failures feed the
        per-tool circuit breaker — after DGV_CIRCUIT_BREAKER_THRESHOLD failures
        (default 5) the circuit opens and /govern denies new proposals for the
        tool until DGV_CIRCUIT_BREAKER_COOLDOWN_MS (default 30s) elapses.
      operationId: reportToolHealth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool, success]
              properties:
                tool: {type: string}
                success: {type: boolean}
                detail: {type: string}
      responses:
        '200':
          description: Updated circuit state
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool: {type: string}
                  circuit_open: {type: boolean}
                  consecutive_failures: {type: integer}

  /tool-health:
    get:
      tags: [CircuitBreaker]
      summary: Circuit breaker state for all tools
      operationId: getToolHealth
      responses:
        '200':
          description: Map of tool → breaker state
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        circuit_open: {type: boolean}
                        consecutive_failures: {type: integer}
                        opened_at_ms: {type: integer, nullable: true}

  /tool-health/reset/{tool}:
    post:
      tags: [CircuitBreaker]
      summary: Manually reset a tool's circuit breaker
      operationId: resetToolHealth
      security:
        - adminKey: []
      parameters:
        - name: tool
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Circuit reset
        '401':
          description: Admin auth required

  /agents/keys:
    post:
      tags: [A2A]
      summary: Register an agent's Ed25519 public key
      description: |
        Agents cannot self-register — keys are admin-provisioned. The key
        verifies the agent's signatures on A2A envelopes. Requires admin key.
      operationId: registerAgentKey
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, public_key_hex]
              properties:
                agent_id: {type: string}
                public_key_hex:
                  type: string
                  description: hex-encoded Ed25519 public key (32 bytes)
      responses:
        '200': {description: Key registered}
        '400': {description: Invalid public key}
        '401': {description: Admin auth required}

  /agents/keys/{agent_id}:
    delete:
      tags: [A2A]
      summary: Deactivate an agent's key
      description: Agent can no longer send or receive A2A envelopes. Admin.
      operationId: deactivateAgentKey
      security:
        - adminKey: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Key deactivated}
        '401': {description: Admin auth required}

  /a2a/send:
    post:
      tags: [A2A]
      summary: Submit a signed agent-to-agent envelope
      description: |
        Delivers a signed envelope from one registered agent to another.
        The gate verifies the sender's Ed25519 signature over the canonical
        string `envelope_id|sender_id|recipient_id|payload_hash|nonce|sent_unix_ms|expires_unix_ms`,
        checks expiry, clock skew, sender/recipient revocation and key status,
        and rejects replays via envelope_id and (sender_id, nonce) uniqueness.
        Payloads never transit the gate — only payload hashes. Returns a
        gate-signed delivery receipt.
      operationId: a2aSend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2aEnvelope'
      responses:
        '200':
          description: Envelope accepted, gate receipt returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: {type: boolean}
                  envelope_id: {type: string}
                  gate_receipt: {type: string}
                  verifying_key: {type: string}
        '403':
          description: Invalid signature, unregistered/revoked sender or recipient
        '409':
          description: Replay detected (duplicate envelope_id or nonce)
        '410':
          description: Envelope expired

  /a2a/inbox/{agent_id}:
    get:
      tags: [A2A]
      summary: Fetch undelivered envelopes
      description: When JWT is configured, the verified sub must equal agent_id.
      operationId: a2aInbox
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Undelivered envelopes
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id: {type: string}
                  envelopes:
                    type: array
                    items:
                      $ref: '#/components/schemas/A2aEnvelopeRecord'
        '401': {description: JWT required}
        '403': {description: JWT sub mismatch}

  /a2a/ack/{envelope_id}:
    post:
      tags: [A2A]
      summary: Acknowledge envelope delivery
      operationId: a2aAck
      parameters:
        - name: envelope_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: {type: string}
      responses:
        '200': {description: Marked delivered}
        '409': {description: Already delivered or not found}

  /config/rate-limit:
    get:
      tags: [Config]
      summary: Get rate limit config
      description: Get current rate limit configuration. Public endpoint.
      operationId: getRateLimit
      responses:
        '200':
          description: Current rate limit config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitConfig'

    put:
      tags: [Config]
      summary: Update rate limit config
      description: Update rate limit config at runtime. Requires admin key.
      operationId: updateRateLimit
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRateLimitRequest'
      responses:
        '200':
          description: Updated config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitConfig'
        '401':
          description: Admin auth required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: Admin API key (set via DGV_ADMIN_KEY env var)

  schemas:
    Proposal:
      type: object
      required: [request_id, agent_id, workflow, tool, action, params, justification, risk_level, identity]
      properties:
        request_id:
          type: string
        agent_id:
          type: string
        workflow:
          type: string
        tool:
          type: string
        action:
          type: string
        params:
          type: object
        justification:
          type: string
        risk_level:
          type: string
        identity:
          type: object
        tenant_id:
          type: string
          description: Optional tenant ID for multi-tenant isolation
        context_hash:
          type: string
          description: Optional SHA-256 hash of the agent's full context (memory, session, etc.). Used in bind_context instead of tool+params hash.

    GovernResponse:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/DecisionReturned'
        evidence_pack_id:
          type: string
        signature:
          type: string
        verifying_key:
          type: string

    DecisionReturned:
      type: object
      properties:
        request_id:
          type: string
        gate_state:
          type: string
          enum: [ALLOW, DENY, SILENCE, ESCALATE]
        reason_codes:
          type: array
          items:
            type: string
        approvals_required:
          type: integer
        approvals_received:
          type: integer
        auth_token:
          $ref: '#/components/schemas/AuthTokenIssued'
          nullable: true
        run_id:
          type: string
        decision_hash:
          type: string
        counterfactual:
          type: object
          nullable: true

    AuthTokenIssued:
      type: object
      properties:
        token_id:
          type: string
        request_id:
          type: string
        policy_version:
          type: string
        tool:
          type: string
        action:
          type: string
        vendor:
          type: string
        amount_cap:
          type: integer
        expires_unix_ms:
          type: integer
        approver_ids:
          type: array
          items:
            type: string
        signature:
          type: string

    ExecuteRequest:
      type: object
      required: [token_id, executor_id, tool, action, params]
      properties:
        token_id:
          type: string
        executor_id:
          type: string
        tool:
          type: string
        action:
          type: string
        params:
          type: object

    ExecuteResponse:
      type: object
      properties:
        allowed:
          type: boolean
        deny_reason:
          type: string
          nullable: true
        receipt:
          type: object
        run_id:
          type: string

    VerifyResponse:
      type: object
      properties:
        run_id:
          type: string
        verified:
          type: boolean
        stored_decision_hash:
          type: string
          nullable: true
        rederived_decision_hash:
          type: string
          nullable: true
        gate_state:
          type: string
          nullable: true
        reason_codes:
          type: array
          items:
            type: string
          nullable: true
        created_unix_ms:
          type: integer
          nullable: true

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        storage:
          type: string
          enum: [connected, disconnected]
        verifying_key:
          type: string

    StatsResponse:
      type: object
      properties:
        decisions_made:
          type: integer
        tokens_issued:
          type: integer
        tokens_consumed:
          type: integer
        denials:
          type: integer

    StorePolicyRequest:
      type: object
      required: [tool, action, script]
      properties:
        tool:
          type: string
        action:
          type: string
        script:
          type: string
          description: ONLY Lang governance script
        policy_version:
          type: string
          default: v1
        min_approvals:
          type: integer
          default: 0
          description: Minimum approvals required before execution (0 = no approval needed)
        min_justification_length:
          type: integer
          default: 0
          description: Minimum justification length in characters (0 = no minimum)

    StorePolicyResponse:
      type: object
      properties:
        policy_id:
          type: string
        active:
          type: boolean
        signature:
          type: string
          description: Ed25519 signature of the policy script (hex)

    LoadPolicyFileRequest:
      type: object
      required: [file_path]
      properties:
        file_path:
          type: string
          description: Path to YAML or JSON policy file

    LoadPolicyFileResponse:
      type: object
      properties:
        loaded:
          type: integer
        errors:
          type: array
          items:
            type: string

    PolicyRecord:
      type: object
      properties:
        policy_id:
          type: string
        tool:
          type: string
        action:
          type: string
        script:
          type: string
        policy_version:
          type: string
        created_unix_ms:
          type: integer
        active:
          type: boolean

    RevokeRequest:
      type: object
      required: [actor_id, reason, revoked_by]
      properties:
        actor_id:
          type: string
        reason:
          type: string
        revoked_by:
          type: string

    RevocationRecord:
      type: object
      properties:
        actor_id:
          type: string
        reason:
          type: string
        revoked_unix_ms:
          type: integer
        revoked_by:
          type: string

    RateLimitConfig:
      type: object
      properties:
        max_requests:
          type: integer
        window_ms:
          type: integer
        enabled:
          type: boolean

    UpdateRateLimitRequest:
      type: object
      properties:
        max_requests:
          type: integer
        window_ms:
          type: integer
        enabled:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string
        hint:
          type: string

    A2aEnvelope:
      type: object
      required: [envelope_id, sender_id, recipient_id, payload_hash, nonce, sent_unix_ms, expires_unix_ms, signature]
      properties:
        envelope_id:
          type: string
          description: Unique envelope ID — replay protection
        sender_id:
          type: string
        recipient_id:
          type: string
        payload_hash:
          type: string
          description: SHA-256 of the payload (payload does not transit the gate)
        nonce:
          type: string
          description: Random nonce, unique per sender
        sent_unix_ms:
          type: integer
        expires_unix_ms:
          type: integer
        signature:
          type: string
          description: Sender's Ed25519 signature (hex) over the canonical envelope string

    A2aEnvelopeRecord:
      allOf:
        - $ref: '#/components/schemas/A2aEnvelope'
        - type: object
          properties:
            sender_signature:
              type: string
            gate_receipt_signature:
              type: string
            delivered:
              type: boolean
            delivered_unix_ms:
              type: integer
              nullable: true
